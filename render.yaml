services:
  - type: web
    name: nourish-recipes
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.14.0
      - key: NOURISH_DB_PATH
        value: /tmp/nourish.db
      - key: THEMEALDB_API_KEY
        value: "1"
      # Optional external recipe & nutrition API keys (set in Render Dashboard)
      - key: USDA_FDC_API_KEY
        sync: false
      - key: EDAMAM_APP_ID
        sync: false
      - key: EDAMAM_APP_KEY
        sync: false
      - key: FATSECRET_CLIENT_ID
        sync: false
      - key: FATSECRET_CLIENT_SECRET
        sync: false
      - key: SPOONACULAR_API_KEY
        sync: false
